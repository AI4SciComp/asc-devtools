name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shell quality tools
        run: sudo apt-get update && sudo apt-get install --yes shellcheck shfmt
      - name: Syntax check
        run: bash -n bin/asc lib/asc/*.sh completions/asc.bash scripts/*.sh tests/*.sh
      - name: ShellCheck
        run: shellcheck bin/asc lib/asc/*.sh completions/asc.bash scripts/*.sh tests/*.sh
      - name: Formatting
        run: shfmt -d -i 2 -ci bin/asc lib/asc/*.sh completions/asc.bash scripts/*.sh tests/*.sh
      - name: Offline tests
        run: ./tests/run_tests.sh
      - name: Installed CLI smoke test
        run: |
          temporary_prefix="$(mktemp -d)"
          trap 'rm -r -- "${temporary_prefix}"' EXIT
          ./scripts/install.sh --prefix "${temporary_prefix}"
          "${temporary_prefix}/bin/asc" --version
          "${temporary_prefix}/bin/asc" --help
          ./scripts/uninstall.sh --prefix "${temporary_prefix}"
