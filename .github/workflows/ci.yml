name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.25.x", "1.26.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Check formatting
        run: |
          test -z "$(find cmd internal -name '*.go' -print0 | xargs -0 gofmt -l)"
          bash -n scripts/*.sh
      - name: Verify dependency-free module
        run: |
          go mod tidy
          test ! -e go.sum
          ! grep -q '^require' go.mod
          git diff --exit-code -- go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race test
        if: matrix.go-version == '1.25.x'
        run: go test -race ./...
      - name: Static build and smoke tests
        run: |
          CGO_ENABLED=0 go build -buildvcs=false -trimpath \
            -ldflags "-s -w -X main.version=1.0.0" \
            -o /tmp/asc ./cmd/asc
          /tmp/asc --version
          /tmp/asc --help
          scripts/test_install.sh /tmp/asc

      - name: Install package test prerequisites
        run: sudo apt-get update && sudo apt-get install -y fakeroot
      - name: Build and test release packages
        if: matrix.go-version == '1.25.x'
        run: |
          bash scripts/package.sh 1.0.0
          bash scripts/test_package.sh dist 1.0.0
      - name: Test APT installation and removal
        if: matrix.go-version == '1.25.x'
        run: |
          sudo apt-get install -y ./dist/asc-devtools_1.0.0_amd64.deb
          test "$(command -v asc)" = /usr/bin/asc
          asc --version
          asc --help
          sudo apt-get remove -y asc-devtools
          test ! -e /usr/bin/asc
