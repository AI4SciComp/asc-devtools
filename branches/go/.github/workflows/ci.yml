name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.25.x", "1.26.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Check formatting
        run: |
          test -z "$(find cmd internal -name '*.go' -print0 | xargs -0 gofmt -l)"
          bash -n scripts/*.sh
      - name: Verify dependency-free module
        run: |
          go mod tidy
          test ! -e go.sum
          ! grep -q '^require' go.mod
          git diff --exit-code -- go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race test
        if: matrix.go-version == '1.25.x'
        run: go test -race ./...
      - name: Static build and smoke tests
        run: |
          CGO_ENABLED=0 go build -buildvcs=false -trimpath \
            -ldflags "-s -w -X main.version=0.1.0" \
            -o /tmp/asc ./cmd/asc
          /tmp/asc --version
          /tmp/asc --help
          scripts/test_install.sh /tmp/asc
